name: Keep one View Resume button
on:
  push:
    paths:
      - '.github/workflows/update-homepage-resume.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deduplicate resume links
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Keep navigation pointing to the homepage resume section.
          s = re.sub(r'(<a\s+href=")functional-resume\.html(">Resume</a>)', r'\1#resume\2', s, count=1)
          # Keep one prominent hero button for recruiters.
          s, n = re.subn(r'<a\b[^>]*>View Resume</a>', '<a class="btn secondary" href="functional-resume.html">View Resume</a>', s, count=1, flags=re.I)
          if n != 1:
              raise SystemExit('Could not locate the main View Resume button; no edit applied.')
          # Remove redundant hero download/view button, without leaving a broken control.
          s = re.sub(r'\s*<a\b[^>]*\bid="(?:downloadResumeHero|functionalResumeHero)"[^>]*>.*?</a>', '', s, count=1, flags=re.S|re.I)
          # Remove duplicate resume section CTA. Section content and navigation stay.
          s = re.sub(r'\s*<div class="cta" style="justify-content:flex-start;margin:0 0 28px">\s*<a\b[^>]*\bid="(?:downloadResumeSection|functionalResumeSection)"[^>]*>.*?</a>\s*</div>', '', s, count=1, flags=re.S|re.I)
          # Ensure the one remaining visible action is consistently labeled.
          p.write_text(s, encoding='utf-8')
          print('One primary View Resume button retained.')
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Keep one View Resume button on portfolio"
          git push
