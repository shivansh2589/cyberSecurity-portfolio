name: Add Microsoft 365 home-lab project to homepage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-m365-project.yml']
permissions:
  contents: write
jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add project and achievement with existing styles
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html
          card = "<article class=\"card project-card\"><div class=\"project-meta\">PROJECT 07</div><h3>Microsoft 365 Email Security Monitoring</h3><p>Connected personal Outlook to Microsoft Graph with a Python/MSAL monitor, message deduplication, five-minute systemd scheduling, and Wazuh JSON ingestion. Created rules 100500, 100501, and 100502; verified a real Gmail-to-Outlook phishing-style test in Threat Hunting.</p><a href=\"m365-email-security.html\" class=\"evidence-link\">View Evidence ↗</a></article>"
          achievement = "<div class=\"card achievement\"><span class=\"dot\"></span><div><h3>Automated Email Security Monitoring</h3><p>Built and validated an Outlook → Microsoft Graph → Python/MSAL → Wazuh home-lab pipeline with five-minute monitoring, deduplication, three custom rules, and a real Gmail phishing-style test alert verified in Threat Hunting.</p></div></div>"
          if 'PROJECT 07' not in html:
              match = re.search(r'<section id="projects">.*?</section>', html, re.S)
              assert match, 'Projects section missing'
              section = match.group()
              end = section.rfind('</article>') + len('</article>')
              assert end > len('</article>'), 'Project cards missing'
              section = section[:end] + '\n        ' + card + section[end:]
              html = html[:match.start()] + section + html[match.end():]
          if 'Automated Email Security Monitoring' not in html:
              marker = '<div class="achievements">'
              assert html.count(marker) == 1, 'Achievements section missing'
              html = html.replace(marker, marker + '\n        ' + achievement, 1)
          assert html.count('PROJECT 07') == 1
          assert html.count('Automated Email Security Monitoring') == 1
          assert Path('m365-email-security.html').exists()
          for name in ['systemd-timer.png', 'custom-rules.png', 'threat-hunting-real-alert.png']:
              assert (Path('assets/m365') / name).exists()
          path.write_text(html, encoding='utf-8')
      - name: Commit homepage additions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Microsoft 365 project and achievement to homepage"
          git push origin main
